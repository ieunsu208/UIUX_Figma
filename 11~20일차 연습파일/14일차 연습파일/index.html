<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14일차 연습파일</title>

    <!-- css 연결 -->
    <link rel="stylesheet" href="normal.css">
    <link rel="stylesheet" href="style01.css">
    <link rel="stylesheet" href="style02.css">
</head>
<body>
    <section class="bestsellers-section">
        <!-- ul-nav / 섹션안에 상단 부분 -->
        <div class="ul-nav">
            <div class="section-title">Bestsellers</div>
            <div class="view-all">View All</div>
        </div>
        <!-- amp-swiper / 섹션안에 하단 부분 -->
         <div class="amp-swiper">
            <!-- best-product-list / 리스트 -->
            <div class="best-product-list best-product-list01">
                 <!-- best-img-box / 이미지 박스 -->
                <div class="best-img-box">
                    <img src="#" alt="향수 이미지">
                </div>
                <!-- 텍스트 박스 -->
                <!-- p태그: 문단태그 -->
                <p class="best-discount-title">Niacinamide 10% + Zinc 1%</p>
                <p class="best-discount-subhead">Oil Control, Brightens, Smooths</p>
                <div class="best-price-volume">
                    <a class="best-price" href="#">₩8700 KRW</a>
                    <a class="best-volume" href="#">
                        <span class="best-volume-30ml">30ml</span>
                        <span class="best-volume-60ml">60ml</span>
                    </a>
                </div>
                <!-- best-pro-btn / 버튼 -->
                <button class="best-pro-btn" type="button">Add to Cart</button>
            </div>
            <div class="best-product-list best-product-list02">리스트02</div>
            <div class="best-product-list best-product-list03">리스트03</div>
            <div class="best-product-list best-product-list04">리스트04</div>
        </div>
    </section>
</body>
</html>
