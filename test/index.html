<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구현 실습</title>

    <!-- css 연결 -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="normal.css">
</head>
<body>
    <!-- 시멘틱 구조 / 가이드(길 안내) -->
    <!-- 상단바 -->
    <header>상단바</header>

    <!-- 메인 컨텐츠 -->
    <main>
        <!-- bestsellers-section / 베스트셀러 섹션 -->
        <section class="bestsellers-section">
            <!-- ul-nav / 섹션안에 상단 부분 -->
            <div class="ul-nav">
                <div class="section-title">Bestsellers</div>
                <div class="view-all">View All</div>
            </div>

            <!-- amp-swiper / 섹션안에 하단 부분 -->
            <div class="amp-swiper">amp-swiper</div>
        </section>
    </main>

    <!-- 하단바 -->
    <footer>하단바</footer>
</body>
</html>
